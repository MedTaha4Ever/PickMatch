name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        arch: [x64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - name: Publish
        run: dotnet publish src/PickMatch/PickMatch.csproj -c Release -r win-${{ matrix.arch }} -p:Platform=${{ matrix.arch }} -o publish/PickMatch
      - name: Zip
        run: Compress-Archive -Path publish/PickMatch -DestinationPath PickMatch-win-${{ matrix.arch }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: PickMatch-win-${{ matrix.arch }}
          path: PickMatch-win-${{ matrix.arch }}.zip
      - name: Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: PickMatch-win-${{ matrix.arch }}.zip
