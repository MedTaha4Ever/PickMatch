name: build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Self-test (cross-platform code path)
        run: dotnet run --project tests/MatchCheck -c Release -f net10.0 -- --selftest
      - name: Self-test (Windows code path)
        if: runner.os == 'Windows'
        run: dotnet run --project tests/MatchCheck -c Release -f net10.0-windows10.0.22621.0 -- --selftest

  windows:
    needs: test
    runs-on: windows-latest
    strategy:
      matrix:
        arch: [x64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Publish (WinUI)
        run: dotnet publish src/PickMatch/PickMatch.csproj -c Release -r win-${{ matrix.arch }} -p:Platform=${{ matrix.arch }} -o publish/PickMatch
      - name: Zip
        run: Compress-Archive -Path publish/PickMatch -DestinationPath PickMatch-windows-${{ matrix.arch }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: PickMatch-windows-${{ matrix.arch }}
          path: PickMatch-windows-${{ matrix.arch }}.zip
      - name: Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: PickMatch-windows-${{ matrix.arch }}.zip

  linux:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [x64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Publish (Uno desktop)
        run: dotnet publish src/PickMatch.Desktop/PickMatch.Desktop.csproj -c Release -f net10.0-desktop -r linux-${{ matrix.arch }} --self-contained -o publish/PickMatch
      - name: Archive
        run: |
          cp packaging/linux/* publish/PickMatch/ 2>/dev/null || true
          chmod +x publish/PickMatch/PickMatch
          tar -C publish -czf PickMatch-linux-${{ matrix.arch }}.tar.gz PickMatch
      - uses: actions/upload-artifact@v4
        with:
          name: PickMatch-linux-${{ matrix.arch }}
          path: PickMatch-linux-${{ matrix.arch }}.tar.gz
      - name: Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: PickMatch-linux-${{ matrix.arch }}.tar.gz

  macos:
    needs: test
    runs-on: macos-latest
    strategy:
      matrix:
        arch: [arm64, x64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Publish (Uno desktop, .app bundle)
        run: dotnet publish src/PickMatch.Desktop/PickMatch.Desktop.csproj -c Release -f net10.0-desktop -r osx-${{ matrix.arch }} --self-contained -p:PackageFormat=app -o publish
      - name: Zip
        run: |
          APP=$(find publish -maxdepth 2 -name "*.app" | head -1)
          echo "App bundle: $APP"
          test -n "$APP"
          ditto -c -k --keepParent "$APP" PickMatch-macos-${{ matrix.arch }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: PickMatch-macos-${{ matrix.arch }}
          path: PickMatch-macos-${{ matrix.arch }}.zip
      - name: Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: PickMatch-macos-${{ matrix.arch }}.zip
